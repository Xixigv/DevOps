apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-auto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memory-auto
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 50   # escala cuando el promedio supera 32Mi (50% de los 64Mi de request)
